name: Build apk

# 只产出 OpenWrt apk 包（25.x SDK 起默认 apk 体系），不再出 ipk。
# 与上游 QiuSimons/luci-app-honk 的差异：honk/Makefile 已移除
# `+HONK_USE_VMLINUX_BTF:vmlinux-btf`，编出来的包不会依赖 vmlinux-btf。

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'OpenWrt SDK 分支（25.x 起产出 apk）'
        required: false
        default: openwrt-25.12
      packages:
        description: '要编译的包，空格分隔'
        required: false
        default: 'honk luci-app-honk'
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdk: ${{ steps.meta.outputs.sdk }}
      packages: ${{ steps.meta.outputs.packages }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' honk/Makefile | head -n 1 | cut -d= -f2)
          pkg_release=$(grep '^PKG_RELEASE:=' honk/Makefile | head -n 1 | cut -d= -f2)
          sdk="${{ inputs.sdk || 'openwrt-25.12' }}"
          packages="${{ inputs.packages || 'honk luci-app-honk' }}"

          version="${pkg_version}-r${pkg_release}"
          echo "version=${version}"                >> "$GITHUB_OUTPUT"
          echo "release_tag=honk_${version}"       >> "$GITHUB_OUTPUT"
          echo "release_name=honk_${version}"      >> "$GITHUB_OUTPUT"
          echo "sdk=${sdk}"                        >> "$GITHUB_OUTPUT"
          echo "packages=${packages}"              >> "$GITHUB_OUTPUT"

          echo "Version: ${version} / SDK: ${sdk} / Packages: ${packages}"

  build:
    name: Build ${{ matrix.short }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            short: x86_64
          - arch: aarch64_generic
            short: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        uses: sbwml/openwrt-gh-action-sdk@go1.26
        env:
          ARCH: ${{ matrix.arch }}-${{ needs.prepare.outputs.sdk }}
          FEEDNAME: packages_ci
          # luci-i18n-honk-zh-cn 在部分 SDK 的 luci feeds 里不存在，会导致
          # `make package/<pkg>/download` 报 No rule to make target（exit 2）。
          # 默认不带它，需要时在 workflow_dispatch 的 packages 输入框里补上。
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          NO_REFRESH_CHECK: true
          # 关闭 action 自带的 shfmt 格式门禁（init 脚本为手工排版）
          NO_SHFMT_CHECK: true
          V: s

      - name: Rename artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          short="${{ matrix.short }}"
          shopt -s nullglob
          for f in bin/packages/${{ matrix.arch }}/packages_ci/*.apk; do
            base="$(basename "$f")"
            name="${base%.apk}"
            # 名字里已带架构的保持原样；noarch 包补上架构后缀，避免两个 job 的产物重名
            if [[ "$name" == *x86_64* || "$name" == *aarch64* ]]; then
              new="$base"
            else
              new="${name}-${short}.apk"
            fi
            cp "$f" "dist/${new}"
          done
          ls -lah dist

      - name: Assert no vmlinux-btf dependency
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in dist/*.apk; do
            deps=$(gzip -dc "$f" | tar -xO .PKGINFO 2>/dev/null | grep '^depend = ' || true)
            if echo "$deps" | grep -q 'vmlinux-btf'; then
              echo "::error file=$f::仍然依赖 vmlinux-btf"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "honk/Makefile 的依赖没有清理干净，终止发布"
            exit 1
          fi
          echo "✓ 没有任何包依赖 vmlinux-btf"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.short }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Deduplicate noarch packages
        shell: bash
        run: |
          set -euo pipefail
          cd release-dist
          # noarch 包（luci-app-honk / luci-i18n-*）在 rename 阶段被两个 job 各自
          # 追加了 -x86_64 / -aarch64 后缀，内容完全相同。仅当同一 basename 去掉
          # 后缀后「两种后缀的包都出现」才判定为重复：合并成单个原始名文件。
          # 注意：honk 核心包的文件名以 -x86_64 / -aarch64_generic.apk 结尾且只有
          # 一种后缀，不会被误判（不会进入成对去重）。
          SUFFIXES="x86_64 aarch64"
          for s1 in $SUFFIXES; do
            for f in *-${s1}.apk; do
              [ -e "$f" ] || continue
              key="${f%-${s1}.apk}"
              for s2 in $SUFFIXES; do
                [ "$s1" = "$s2" ] && continue
                twin="${key}-${s2}.apk"
                if [ -f "$twin" ]; then
                  mv -f "$f" "${key}.apk"
                  rm -f "$twin"
                  echo "dedupe: ${key}.apk"
                  break
                fi
              done
            done
          done
          echo "=== release files after dedupe ==="
          ls -1

      - name: Replace old release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          # 每次发布（含同 tag 重跑）都先把旧附件删掉，只保留本次产物：
          # 语言包等随版本变化的文件不会在 Release 里越积越多。
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            if [ -n "$assets" ]; then
              for a in $assets; do
                echo "remove old asset: $a"
                gh release delete-asset "$tag" --repo "$GITHUB_REPOSITORY" --yes "$a"
              done
            fi
          fi

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          files: release-dist/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          target_commitish: ${{ github.sha }}

      - name: Delete old releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Cleanup old action artifacts
        uses: c-hive/gha-remove-artifacts@main
        with:
          age: '3 days'
          skip-recent: 3
        continue-on-error: true
