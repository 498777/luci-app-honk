name: Build apk

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: 'OpenWrt SDK 分支（25.x 起产出 apk）'
        required: false
        default: openwrt-25.12
      packages:
        description: '要编译的包，空格分隔'
        required: false
        default: 'honk luci-app-honk'
      force:
        description: '忽略变更检测，强制编译并发布'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      sdk: ${{ steps.meta.outputs.sdk }}
      packages: ${{ steps.meta.outputs.packages }}
      should_build: ${{ steps.guard.outputs.should_build }}
      fp: ${{ steps.guard.outputs.fp }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate version metadata
        id: meta
        shell: bash
        run: |
          pkg_version=$(grep '^PKG_VERSION:=' honk/Makefile | head -n 1 | cut -d= -f2)
          pkg_release=$(grep '^PKG_RELEASE:=' honk/Makefile | head -n 1 | cut -d= -f2)
          sdk="${{ inputs.sdk || 'openwrt-25.12' }}"
          packages="${{ inputs.packages || 'honk luci-app-honk' }}"

          version="${pkg_version}-r${pkg_release}"
          echo "version=${version}"                >> "$GITHUB_OUTPUT"
          rel_date=$(date -u +%Y.%m.%d)
          echo "release_tag=honk_${rel_date}"       >> "$GITHUB_OUTPUT"
          echo "release_name=honk_${rel_date}"      >> "$GITHUB_OUTPUT"
          echo "sdk=${sdk}"                        >> "$GITHUB_OUTPUT"
          echo "packages=${packages}"              >> "$GITHUB_OUTPUT"

          echo "Version: ${version} / SDK: ${sdk} / Packages: ${packages}"

      - name: Change guard
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          up="$(grep '^HONK_RELEASE_TAG:=' honk/Makefile | head -n 1 | cut -d= -f2)"
          src=$(git ls-files -s honk luci-app-honk Makefile | git hash-object --stdin)
          fp="${up}-${src:0:12}"
          echo "fp=${fp}" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "手动强制构建（force=true）"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""' || echo "")
          last=""
          if [ -n "$latest_tag" ]; then
            last=$(gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' || echo "")
          fi
          if printf '%s' "$last" | grep -q "fp:${fp}"; then
            echo "无变化（指纹 ${fp} 与最近一次 Release 相同）：跳过编译与发布"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到变化（指纹 ${fp}）：继续编译"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.short }}
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            short: x86_64
          - arch: aarch64_generic
            short: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Build packages
        uses: sbwml/openwrt-gh-action-sdk@go1.26
        env:
          ARCH: ${{ matrix.arch }}-${{ needs.prepare.outputs.sdk }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          NO_REFRESH_CHECK: true
          NO_SHFMT_CHECK: true
          V: s

      - name: Assert no vmlinux-btf dependency
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for f in bin/packages/${{ matrix.arch }}/packages_ci/*.apk; do
            deps=$(gzip -dc "$f" | tar -xO .PKGINFO 2>/dev/null | grep '^depend = ' || true)
            if echo "$deps" | grep -q 'vmlinux-btf'; then
              echo "::error file=$f::仍然依赖 vmlinux-btf"
              found=1
            fi
          done
          if [ "$found" -ne 0 ]; then
            echo "honk/Makefile 的依赖没有清理干净，终止发布"
            exit 1
          fi
          echo "✓ 没有任何包依赖 vmlinux-btf"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.short }}
          path: bin/packages/${{ matrix.arch }}/packages_ci/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_build == 'true'
    steps:
      - name: Download apk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release-dist

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rel
          for d in release-dist/*/; do
            label="${d#release-dist/}"
            label="${label%/}"
            label="${label#apk-}"
            for f in "$d"*.apk; do
              [ -e "$f" ] || continue
              name=$(basename "$f")
              case "$name" in
                honk-*)
                  cp "$f" "rel/${name%.apk}-${label}.apk"
                  ;;
                *)
                  [ "$label" = "x86_64" ] && cp "$f" "rel/$name"
                  ;;
              esac
            done
          done
          echo "=== release assets ==="
          ls -1 rel

      - name: Replace old release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            if [ -n "$assets" ]; then
              for a in $assets; do
                echo "remove old asset: $a"
                gh release delete-asset "$tag" --repo "$GITHUB_REPOSITORY" --yes "$a"
              done
            fi
          fi

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.release_tag }}"
          title="${{ needs.prepare.outputs.release_name }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" rel/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "fp:${{ needs.prepare.outputs.fp }} Automated build of ${title}"
          else
            gh release create "$tag" rel/* --repo "$GITHUB_REPOSITORY" --title "$title" --notes "fp:${{ needs.prepare.outputs.fp }} Automated build of ${title}"
          fi

      - name: Delete old releases
        uses: ophub/delete-releases-workflows@main
        with:
          delete_releases: true
          releases_keep_latest: 3
          delete_tags: true
          delete_workflows: true
          workflows_keep_day: 3
          gh_token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Cleanup old action artifacts
        uses: c-hive/gha-remove-artifacts@main
        with:
          age: '3 days'
          skip-recent: 3
        continue-on-error: true
