<script type="text/javascript">
	//<![CDATA[
	function scroll_log(dir) {
		var el = document.getElementById('log_textarea');
		if (dir === 'top')
			el.scrollTop = 0;
		else
			el.scrollTop = el.scrollHeight;
	}
	var scrolled = false;
	XHR.poll(2, '<%=url([[admin]], [[services]], [[honk]], [[get_log]])%>', null,
		function(x, data) {
			if(x && x.status == 200) {
				var log_textarea = document.getElementById('log_textarea');
				log_textarea.textContent = x.responseText;
				if (!scrolled) {
					log_textarea.scrollTop = log_textarea.scrollHeight;
					scrolled = true;
				}
			}
		}
	);
	//]]>
</script>
<fieldset class="cbi-section" id="_log_fieldset">
	<div style="margin: 10px 10px 0;">
		<input class="cbi-button cbi-button-neutral" type="button" onclick="scroll_log('top')" value="<%:Scroll to top%>">
		<input class="cbi-button cbi-button-neutral" type="button" onclick="scroll_log('bottom')" value="<%:Scroll to bottom%>">
	</div>
	<textarea id="log_textarea" class="cbi-input-textarea" style="width: calc(100% - 20px); height: 600px; margin: 10px;" data-update="change" rows="5" wrap="off" readonly="readonly"></textarea>
</fieldset>
